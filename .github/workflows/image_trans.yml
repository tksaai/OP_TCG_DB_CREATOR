name: GDrive Image Converter

on:
  # OP_TCG_DB already performs its own daily official-image sync.
  # Run this only when manually importing images missing from its manifest.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade Pillow gdown

      - name: Test image filtering
        run: python -m unittest -v test_process_images.py

      - name: Sync missing images to OP_TCG_DB
        env:
          JSON_FILE_ID: "1XuSQYYy8RVLhh98x6kFNg_0oWJ0peySV"
          TARGET_REPO: "tksaai/OP_TCG_DB"
          TARGET_BRANCH: "main"
          API_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail

          gdown "$JSON_FILE_ID" -O ./file_list.json

          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git clone --depth 1 --branch "$TARGET_BRANCH" \
            "https://x-access-token:$API_TOKEN@github.com/$TARGET_REPO.git" target_repo

          python process_images.py \
            --json "./file_list.json" \
            --output "./target_repo/CardsWebP" \
            --exclude "_small" \
            --manifest "./target_repo/image-manifest.json" \
            --only-missing-manifest \
            --format webp \
            --quality 90 \
            --delay 1

          cd target_repo
          node scripts/build-image-manifest.mjs
          python scripts/build-card-features.py
          node scripts/test-data-integrity.mjs

          git add CardsWebP image-manifest.json card-features.json card-feature-cache.json
          if git diff --staged --quiet; then
            echo "No missing images to commit."
            exit 0
          fi

          git commit -m "Sync missing Google Drive images"
          git push origin "$TARGET_BRANCH"
          echo "Successfully pushed missing images to $TARGET_REPO"
